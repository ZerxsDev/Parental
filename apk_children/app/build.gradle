plugins {
    id 'com.android.application'
}

android {
    namespace 'com.company.children'   // WAJIB sama dengan package aplikasi
    compileSdk 34

    defaultConfig {
        applicationId "com.company.children"  // package apk sesuai konfigurasi
        minSdk 23                              // API 23 (Android 6.0) sesuai konfigurasi
        targetSdk 33                           // targetSdk 34 di beberapa IDE menagih permission tambahan; 33 lebih stabil utk overlay
        versionCode 1
        versionName "1.0"                      // versi sesuai konfigurasi
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    // Socket.IO client utk koneksi real-time ke server parental (node.js + socket.io)
    implementation 'io.socket:socket.io-client:2.1.1'
}
